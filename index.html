<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナンバーハント Stage11</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:6px;top:0;width:2px;height:14px}
#cross:after{top:6px;left:0;height:2px;width:14px}
#hit{position:fixed;left:50%;top:56%;transform:translateX(-50%);color:#f44;font-weight:bold;font-size:22px;opacity:0;transition:opacity .25s;pointer-events:none}
#log{position:fixed;z-index:10;left:12px;top:max(12px,env(safe-area-inset-top));color:#fff;font-size:12px;line-height:1.4;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:6px;max-width:46vw;max-height:calc(100vh - 24px);overflow:hidden;pointer-events:none}
#log:empty{display:none}
#memo{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;z-index:5}
#mc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#mt{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap}
#mt button{margin-right:6px;padding:4px 10px;font-size:14px}
#ammo{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));color:#fff;font-size:14px;text-align:left;text-shadow:0 1px 3px #000;pointer-events:none}
.slot{margin-top:4px;padding:3px 10px;background:rgba(0,0,0,.45);border-radius:6px;border:2px solid transparent}
.slot.on{border-color:#ffd54a;background:rgba(80,60,0,.7)}
#num{z-index:6;position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));color:#fff;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
.dg{display:inline-block;width:1.2em;text-align:center;border-bottom:2px solid #fff}
.gs{display:block;width:100%;height:10px;background:rgba(255,255,255,.3);margin-top:4px;border-radius:3px;overflow:hidden}
.gs i{display:block;height:100%;background:#7fdc7f}
#cnt{z-index:6;position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:16px;text-shadow:0 1px 3px #000;pointer-events:none}
#num,#ammo,#cnt{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px}
#ammo:empty{display:none}
#num{width:300px}
#mm{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:6;background:rgba(0,0,0,.6);border-radius:50%}
#hit{background:rgba(0,0,0,.6);padding:4px 14px;border-radius:8px}
#home{position:fixed;inset:0;z-index:30;background:linear-gradient(#1b2433,#0a0e15);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box;text-align:center}
#home h1{margin:0;font-size:44px;letter-spacing:4px}
#home button{display:block;width:240px;margin:10px auto;padding:12px;font-size:18px;border-radius:10px;border:2px solid #fff;background:#223;color:#fff;cursor:pointer}
#home button:hover{background:#345}
#hpanel{display:none;max-width:660px;line-height:1.8;font-size:15px;text-align:left;background:rgba(255,255,255,.08);padding:14px 18px;border-radius:10px}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1.9;cursor:pointer}
</style></head><body>
<div id="cross"></div><div id="hit">HIT!</div><div id="log"></div><div id="ammo"></div><div id="num"></div><div id="cnt"></div><canvas id="mm" width="180" height="180"></canvas>
<div id="memo"><canvas id="mc"></canvas><div id="mt"><button data-c="#111">黒</button><button data-c="#d22">赤</button><button data-c="#26c">青</button><button data-c="eraser">消しゴム</button><button data-c="clear">全消し</button>　<span id="mpg"></span>　Tab：相手切替　Mで閉じる</div></div>
<div id="msg" style="display:none">一時停止<br>クリックで再開</div>
<div id="home">
  <div id="hmain"><h1>ナンバーハント</h1><p>背中の3桁を読み取れ。誰かの数字を当てれば脱落。</p>
    <button id="hs">スタート</button><button id="hh">遊び方</button><button id="hc">設定</button></div>
  <div id="hpanel"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ec9f0);
scene.fog=new THREE.Fog(0x9ec9f0,15,48);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,300);
cam.rotation.order='YXZ';
const rd=new THREE.WebGLRenderer({antialias:true});
rd.setSize(innerWidth,innerHeight);
document.body.appendChild(rd.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.6);
sun.position.set(30,50,20);scene.add(sun);

const S=90,H=S/2,wd=v=>v-S*Math.round(v/S); // 世界は端がつながっている（円環）
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x6a9a5a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(100,50,0x557744,0x557744);
grid.position.y=0.02;scene.add(grid);

const boxes=[],targets=[],bm=[];
function addBox(x,z,w,d,h,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
  m.position.set(x,h/2,z);m.userData.bx=x;m.userData.bz=z;scene.add(m);targets.push(m);bm.push(m);
  boxes.push({cx:x,cz:z,hx:w/2,hz:d/2,maxY:h});
}
// 階段と高台（0.3mずつ歩いて上れる）
const SX=14,SZ=-10;
for(let i=0;i<8;i++)addBox(SX+i+0.5,SZ,1,3,0.3*(i+1),0xcfc3a0);
addBox(SX+11,SZ,6,6,2.4,0xb8a888);
// ジャンプで乗れる低い箱
addBox(-6,-6,2,2,1.0,0xd09050);addBox(-9,-6,2,2,1.3,0xd09050);
// 登れる建物：階段で2階（3.6m）、ブロックを飛び移って3階（7.2m）
const TW=[[-26,26],[28,30],[-30,-28]];
function tower(cx,cz){
  addBox(cx,cz,14,14,3.6,0xb9b2a0);
  for(let i=0;i<12;i++)addBox(cx,cz-19+i+0.5,3,1,0.3*(i+1),0xcfc3a0);
  addBox(cx+4,cz+4,6,6,7.2,0x9c9585);
  addBox(cx-2,cz+2,2,2,4.8,0xd09050);addBox(cx,cz+2,2,2,6.0,0xd09050);
}
TW.forEach(t=>tower(t[0],t[1]));
const HI=[]; // 高所の宝箱スポット [x,z,高さ]
TW.forEach(([cx,cz])=>HI.push([cx-4,cz-4,3.6],[cx+4,cz-4,3.6],[cx-4,cz+5,3.6],[cx+4,cz+4,7.2]));
HI.push([SX+11,SZ,2.4],[8+3*2.6,26,4.8],[-18-3*2.6,-10,4.8]);
// 二段ジャンプで登れるブロックの列（1.2mずつ高くなる）
[[8,26,1],[-18,-10,-1]].forEach(([x,z,dir])=>{for(let i=0;i<4;i++)addBox(x+dir*i*2.6,z,2,2,1.2*(i+1),0xd09050)});
const KEEP=[[SX+7,SZ,10],[13,26,12],[-22,-10,12],...TW.map(t=>[t[0],t[1]-6,20])];
// 長い壁と建物（固定シード）
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=[0xc9b896,0xaaaaaa,0xb07a6a,0x8899aa,0xd8d0c0];
const bad=(x,z,w,d)=>Math.hypot(x,z)<Math.max(w,d)/2+8||KEEP.some(k=>Math.hypot(x-k[0],z-k[1])<Math.max(w,d)/2+k[2]);
for(let i=0;i<20;i++){
  const len=18+rnd()*22,horiz=rnd()<0.5,h=5+rnd()*3;
  const w=horiz?len:1.5,d=horiz?1.5:len;
  const x=(rnd()-0.5)*S,z=(rnd()-0.5)*S;
  if(bad(x,z,w,d))continue;
  addBox(x,z,w,d,h,0x8a8a92);
}
for(let i=0;i<60;i++){
  const big=rnd()<0.5,tall=rnd()<0.4;
  const w=big?5+rnd()*9:1.5+rnd()*2,d=big?5+rnd()*9:1.5+rnd()*2;
  const h=big?(tall?9+rnd()*8:4+rnd()*5):1.2+rnd()*1.5;
  const x=(rnd()-0.5)*S,z=(rnd()-0.5)*S;
  const c=cols[Math.floor(rnd()*cols.length)];
  if(bad(x,z,w,d))continue;
  addBox(x,z,w,d,h,c);
}

// 当たり判定：yは足元の高さ。0.4mまでの段差は歩いて上れる（浮動小数点の誤差対策で余裕を持たせる）
function hit(x,z,y,r){
  for(const b of boxes)if(b.maxY>y+0.4&&Math.abs(wd(x-b.cx))<b.hx+r&&Math.abs(wd(z-b.cz))<b.hz+r)return true;
  return false;
}
function floorAt(x,z,y,r){
  let f=0;
  for(const b of boxes)if(b.maxY<=y+0.41&&b.maxY>f&&Math.abs(wd(x-b.cx))<b.hx+r&&Math.abs(wd(z-b.cz))<b.hz+r)f=b.maxY;
  return f;
}

// 到達可能マス（宝箱・ボットの出現位置用。壁で囲まれた場所には出さない）
const G=S,open=new Uint8Array(G*G),cx=i=>i-H+0.5;
for(let i=0;i<G;i++)for(let j=0;j<G;j++)open[i*G+j]=hit(cx(i),cx(j),0,0.5)?0:1;
const seen=new Uint8Array(G*G),q=[H*G+H],reach=[];seen[H*G+H]=1;
while(q.length){
  const c=q.pop(),i=(c/G)|0,j=c%G;reach.push([cx(i),cx(j)]);
  for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const ni=(i+a+G)%G,nj=(j+b+G)%G;
    const k=ni*G+nj;if(open[k]&&!seen[k]){seen[k]=1;q.push(k)}
  }
}
const rpos=(minD=0)=>{for(let n=0;n<50;n++){const r=reach[(Math.random()*reach.length)|0];if(Math.hypot(r[0],r[1])>=minD)return r}return reach[0]};

// ===== ボット =====
function mkPlate(n){
  const c=document.createElement('canvas');c.width=192;c.height=112;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,192,112);
  g.fillStyle='#111';g.font='bold 84px monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText(n,96,58);
  return new THREE.CanvasTexture(c);
}
const used=new Set();
function uniq(){let n;do{n=String(Math.floor(Math.random()*1000)).padStart(3,'0')}while(used.has(n));used.add(n);return n}
const myNum=uniq(),INV=5,GONE=2,TURN=1.75,INVP=6,SPD=8,FRZ=4,TRR=2.5,WALK=8,AIR=1,BSPD=4.5,XRAYT=8,RADART=10,CLOAKT=6,SPAWNT=5,STEPT=0.12,STEPV=50,STEPCD=3;
const bots=[],palette=[0xe67e22,0x9b59b6,0x2ecc71],BN=['オレンジ','紫','緑'];
const newK=()=>({par:[null,null,null],lo:[0,0,0],hi:[9,9,9],sp:null,slo:0,shi:27,m3:null,dup:null,ev:null,pc:null,mm:null,mxlo:0,mxhi:9,mnlo:0,mnhi:9,has:{},dl:{},dx:{},sm:{},cmp:{}});
const ALL=[...Array(1000).keys()].map(i=>String(i).padStart(3,'0'));
function newTarget(b){let r;for(let n=0;n<30;n++){r=rpos();if(Math.hypot(wd(r[0]-b.x),wd(r[1]-b.z))<25)break}b.tx=r[0];b.tz=r[1];b.t=0}
for(let i=0;i<3;i++){
  const num=uniq();
  const mat=new THREE.MeshLambertMaterial({color:palette[i],transparent:true});
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.4,0.4),mat);body.position.y=0.7;
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),mat);head.position.y=1.62;
  const plate=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.35),new THREE.MeshBasicMaterial({map:mkPlate(num)}));
  plate.position.set(0,1.0,-0.21);plate.rotation.y=Math.PI;
  g.add(body,head,plate);scene.add(g);
  const b={g,mat,plate,st:'alive',inv:0,gone:0,frz:0,blind:0,K:newK(),num,name:BN[i],color:palette[i],x:0,z:0,flash:0,tx:0,tz:0,t:0,yaw:0,gauge:0,cand:{},ammo:[],path:[],pt:0,fcd:0,ait:6,fv:null};
  [body,head,plate].forEach(m=>{m.userData.bot=b;targets.push(m)});
  {const r=rpos(10);b.x=r[0];b.z=r[1]}
  newTarget(b);bots.push(b);
}

// ===== ヒント（相手ごとの知識Kに統合して表示＝似たヒントは1つにまとまる）=====
const rk=()=>Math.floor(Math.random()*3),rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pair=()=>{const a=rk();let b;do{b=rk()}while(b===a);return a<b?[a,b]:[b,a]};
const L3='ABC',pk=q=>q.p[0]+''+q.p[1],pn=q=>L3[q.p[0]]+'と'+L3[q.p[1]],sg=x=>x>0?1:x<0?-1:0,PR=[2,3,5,7];
const bnd=(lo,hi,a,n)=>a?[Math.max(lo,n),hi]:[lo,Math.min(hi,n-1)];
function lim(K,k,a,n){const b=bnd(K.lo[k],K.hi[k],a,n);K.lo[k]=b[0];K.hi[k]=b[1]}
const HT=[
 {w:10,mk:()=>({}),ans:d=>d.map(x=>x%2).join(''),ap:(K,a)=>{[...a].forEach((c,i)=>{K.par[i]=+c})},lab:()=>'各桁の偶奇'},
 {w:5,mk:()=>({k:rk()}),ans:(d,q)=>d[q.k]%2,ap:(K,a,q)=>{K.par[q.k]=a},lab:q=>L3[q.k]+'の偶奇'},
 {w:10,nr:[1,9],mk:()=>({k:rk(),n:rn(3,7)}),ans:(d,q)=>d[q.k]>=q.n,ap:(K,a,q)=>lim(K,q.k,a,q.n),lab:q=>L3[q.k]+'は'+q.n+'以上か'},
 {w:10,mk:()=>({}),ans:d=>d.map(x=>x>=5?1:0).join(''),ap:(K,a)=>{[...a].forEach((c,i)=>lim(K,i,c==='1',5))},lab:()=>'HIGH or LOW（A・B・C）'},
 {w:3,mk:()=>({}),ans:d=>(d[0]+d[1]+d[2])%2,ap:(K,a)=>{K.sp=a},lab:()=>'A+B+Cの偶奇'},
 {w:8,nr:[1,27],mk:()=>({n:rn(11,16)}),ans:(d,q)=>d[0]+d[1]+d[2]>=q.n,ap:(K,a,q)=>{const b=bnd(K.slo,K.shi,a,q.n);K.slo=b[0];K.shi=b[1]},lab:q=>'A+B+Cは'+q.n+'以上か'},
 {w:2,mk:()=>({}),ans:d=>new Set(d).size<3,ap:(K,a)=>{K.dup=a},lab:()=>'同じ数字の有無'},
 {w:6,nr:[1,9],mk:()=>({p:pair(),n:rn(2,4)}),ans:(d,q)=>Math.abs(d[q.p[0]]-d[q.p[1]])>=q.n,ap:(K,a,q)=>{const o=K.dl[pk(q)]||[0,9];K.dl[pk(q)]=bnd(o[0],o[1],a,q.n)},lab:q=>pn(q)+'の差は'+q.n+'以上か'},
 {w:8,mk:()=>({}),ans:d=>d.filter(x=>x%2===0).length,ap:(K,a)=>{K.ev=a},lab:()=>'偶数の桁の数'},
 {w:3,mk:()=>({p:pair()}),ans:(d,q)=>d[q.p[0]]%2===d[q.p[1]]%2,ap:(K,a,q)=>{K.sm[pk(q)]=a},lab:q=>pn(q)+'の偶奇は同じか'},
 {w:8,mk:()=>({k:rk()}),ans:(d,q)=>Math.floor(d[q.k]/3),ap:(K,a,q)=>{K.lo[q.k]=Math.max(K.lo[q.k],a*3);K.hi[q.k]=Math.min(K.hi[q.k],a*3+2>9?9:a*3+2)},lab:q=>L3[q.k]+'の範囲（3刻み）'},
 {w:8,mk:()=>({p:pair()}),ans:(d,q)=>d[q.p[0]]-d[q.p[1]],ap:(K,a,q)=>{K.dx[pk(q)]=a},lab:q=>L3[q.p[0]]+'−'+L3[q.p[1]]+'の値'},
 {w:8,nr:[0,9],mk:()=>({n:rn(0,9)}),ans:(d,q)=>d.includes(q.n),ap:(K,a,q)=>{K.has[q.n]=a},lab:q=>q.n+'が含まれているか'},
 {w:8,mk:()=>({}),ans:d=>Math.max(...d)-Math.min(...d),ap:(K,a)=>{K.mm=a},lab:()=>'最大値と最小値の差'},
 {w:6,nr:[1,9],mk:()=>({n:rn(5,8)}),ans:(d,q)=>Math.max(...d)>=q.n,ap:(K,a,q)=>{const b=bnd(K.mxlo,K.mxhi,a,q.n);K.mxlo=b[0];K.mxhi=b[1]},lab:q=>'最大値は'+q.n+'以上か'},
 {w:6,nr:[1,9],mk:()=>({n:rn(1,4)}),ans:(d,q)=>Math.min(...d)>=q.n,ap:(K,a,q)=>{const b=bnd(K.mnlo,K.mnhi,a,q.n);K.mnlo=b[0];K.mnhi=b[1]},lab:q=>'最小値は'+q.n+'以上か'},
 {w:6,mk:()=>({p:pair()}),ans:(d,q)=>sg(d[q.p[0]]-d[q.p[1]]),ap:(K,a,q)=>{K.cmp[pk(q)]=a},lab:q=>pn(q)+'の大小'},
 {w:4,mk:()=>({}),ans:d=>d.filter(x=>PR.includes(x)).length,ap:(K,a)=>{K.pc=a},lab:()=>'素数(2,3,5,7)の桁の数'},
 {w:4,mk:()=>({}),ans:d=>(d[0]+d[1]+d[2])%3,ap:(K,a)=>{K.m3=a},lab:()=>'A+B+Cを3で割った余り'}
];
const HW=HT.reduce((s,h)=>s+h.w,0);
function newHint(){
  let r=Math.random()*HW,ty=0;
  while(r>=HT[ty].w){r-=HT[ty].w;ty++}
  const q=HT[ty].mk();
  return {kind:'hint',cat:'hint',ty,q,label:'ヒント弾：'+HT[ty].lab(q)};
}
// 知識Kを読みやすい行にまとめる（桁ごとに偶奇と範囲を1行へ）
function kLines(K){
  const o=[],R=(lo,hi)=>lo===hi?''+lo:lo+'〜'+hi;
  for(let k=0;k<3;k++){
    const t=[];
    if(K.par[k]!==null)t.push(K.par[k]?'奇数':'偶数');
    if(K.lo[k]>0||K.hi[k]<9)t.push(R(K.lo[k],K.hi[k]));
    if(t.length)o.push(L3[k]+'：'+t.join('・'));
  }
  const s=[];
  if(K.sp!==null)s.push(K.sp?'奇数':'偶数');
  if(K.slo>0||K.shi<27)s.push(R(K.slo,K.shi));
  if(K.m3!==null)s.push('3で割ると'+K.m3+'余る');
  if(s.length)o.push('A+B+C：'+s.join('・'));
  for(const key of new Set([...Object.keys(K.dl),...Object.keys(K.dx),...Object.keys(K.sm),...Object.keys(K.cmp)])){
    const a=+key[0],b=+key[1],t=[],d=K.dl[key];
    if(K.dx[key]!==undefined)t.push(L3[a]+'−'+L3[b]+'＝'+K.dx[key]);
    else if(d&&(d[0]>0||d[1]<9))t.push('差（絶対値）'+R(d[0],d[1]));
    if(K.cmp[key]!==undefined)t.push(L3[a]+['＜','＝','＞'][K.cmp[key]+1]+L3[b]);
    if(K.sm[key]!==undefined)t.push('偶奇は'+(K.sm[key]?'同じ':'違う'));
    if(t.length)o.push(L3[a]+'と'+L3[b]+'：'+t.join('・'));
  }
  if(K.dup!==null)o.push('同じ数字：'+(K.dup?'ある':'ない'));
  if(K.ev!==null)o.push('偶数の桁：'+K.ev+'個');
  if(K.pc!==null)o.push('素数(2,3,5,7)の桁：'+K.pc+'個');
  if(K.mm!==null)o.push('最大−最小＝'+K.mm);
  if(K.mxlo>0||K.mxhi<9)o.push('最大値：'+R(K.mxlo,K.mxhi));
  if(K.mnlo>0||K.mnhi<9)o.push('最小値：'+R(K.mnlo,K.mnhi));
  const yes=Object.keys(K.has).filter(n=>K.has[n]),no=Object.keys(K.has).filter(n=>!K.has[n]);

  o.type='square';o.frequency.value=440;

    let vx=wd(b.x-p.x)*MS,vy=wd(b.z-p.z)*MS;const dd=Math.hypot(vx,vy),lim=c-9;

const PL={isP:true},aX=a=>a===PL?p.x:a.x,aZ=a=>a===PL?p.z:a.z,aY=a=>a===PL?p.y:0;
const aFwd=a=>a===PL?[-Math.sin(p.yaw),-Math.cos(p.yaw)]:[Math.sin(a.yaw),Math.cos(a.yaw)];
const aVuln=a=>a===PL?(p.inv<=0&&p.cloak<=0&&!over):(a.st==='alive'&&a.inv<=0); // 弾が効く（無敵・透明中は効かない）
const aShown=a=>a===PL?(aVuln(a)&&p.hide<=0):aVuln(a); // 背中の数字が見える

function topAt(x,z){let t=0;for(const b of boxes)if(b.maxY>t&&Math.abs(wd(x-b.cx))<b.hx&&Math.abs(wd(z-b.cz))<b.hz)t=b.maxY;return t}
function los(a,b){ // 視線が建物でさえぎられていないか
  const x0=aX(a),z0=aZ(a),y0=aY(a),dx=wd(aX(b)-x0),dz=wd(aZ(b)-z0),dy=aY(b)-y0,n=Math.ceil(Math.hypot(dx,dz));
  for(let i=1;i<n;i++){const t=i/n;if(topAt(x0+dx*t,z0+dz*t)>y0+dy*t+1.4)return false}
  return true;
}
const cellIdx=(x,z)=>(((Math.floor(x+H)%G)+G)%G)*G+(((Math.floor(z+H)%G)+G)%G);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfsPath(sx,sz,gx,gz){ // 円環マップ上の最短経路（マスの中心を返す）
  const si=cellIdx(sx,sz),gi=cellIdx(gx,gz);if(si===gi)return [];
  const prev=new Int32Array(G*G).fill(-1),q=[si];prev[si]=si;
  for(let h=0;h<q.length&&prev[gi]<0;h++){
    const c=q[h],i=(c/G)|0,j=c%G;
    for(const [a,b] of DIRS){const k=((i+a+G)%G)*G+((j+b+G)%G);if(open[k]&&prev[k]<0){prev[k]=c;q.push(k)}}
  }
  if(prev[gi]<0)return [];
  const out=[];for(let c=gi;c!==si;c=prev[c])out.push([cx((c/G)|0),cx(c%G)]);
  return out.reverse();
}
function nextWp(b){if(b.path.length){const w=b.path.shift();b.tx=w[0];b.tz=w[1]}else b.pt=0;b.t=0}
function botGoal(b){ // 弾が足りなければ宝箱へ、そうでなければ相手の背後3mへ
  let goal=null;
  if(b.ammo.length<2){let bd=1e9;for(const c of chests)if(c.on&&c.y===0&&c.item.cat==='hint'){const d=Math.hypot(wd(c.x-b.x),wd(c.z-b.z));if(d<bd){bd=d;goal=[c.x,c.z]}}}
  if(!goal||Math.random()<0.3){
    let bd=1e9,t=null;
    for(const o of [PL,...bots])if(o!==b&&aLive(o)&&aVuln(o)&&aY(o)<0.5){const d=Math.hypot(wd(aX(o)-b.x),wd(aZ(o)-b.z));if(d<bd){bd=d;t=o}}
    if(t){const f=aFwd(t),g=gnear(aX(t)-f[0]*3,aZ(t)-f[1]*3);goal=[g[0],g[1]]}
  }
  if(!goal){const r=rpos();goal=[r[0],r[1]]}
  b.path=bfsPath(b.x,b.z,goal[0],goal[1]);b.pt=1.2;b.t=0;nextWp(b);
}

function botThink(b,dt){
  b.gauge=Math.min(GMAX,b.gauge+dt/120);b.fcd-=dt;
  const others=[PL,...bots].filter(o=>o!==b&&aLive(o));
  b.fv=null;let near=null,nd=1e9;
  for(const o of others){
    const dx=wd(aX(o)-b.x),dz=wd(aZ(o)-b.z),d=Math.hypot(dx,dz);
    if(d>32||!aVuln(o)||!los(b,o))continue;
    if(d<nd){nd=d;near=o}
    const f=aFwd(o); // 相手の背中側（後方60度・12m以内）から見えたら数字を読む
    if(b.blind<=0&&d<12&&aShown(o)&&(dx*f[0]+dz*f[1])/d>0.5)b.cand[aKey(o)]=[aNum(o)];
  }
  if(near&&nd<26)b.fv=[wd(aX(near)-b.x),wd(aZ(near)-b.z)];
  // ヒント弾：正面に見えている相手を撃つ。当たれば候補が絞られ、ゲージが1溜まる
  const hi=b.ammo.findIndex(a=>a.kind==='hint');
  if(hi>=0&&b.fcd<=0&&near&&nd<26){
    const f=aFwd(b),dx=wd(aX(near)-b.x),dz=wd(aZ(near)-b.z);
    if((dx*f[0]+dz*f[1])/nd>0.9&&Math.random()<0.8){
      const a=b.ammo.splice(hi,1)[0],h=HT[a.ty];b.fcd=2.5;
      if(nd<30)sfx('lazer1',0.3);
      const ans=h.ans([...aNum(near)].map(Number),a.q),k=aKey(near);
      b.cand[k]=(b.cand[k]||ALL).filter(n=>h.ans([...n].map(Number),a.q)===ans);
      b.gauge=Math.min(GMAX,b.gauge+1);
      botHit(near,b);
    }
  }
  // 数字判定（ゲージ1で1回）：候補が少ない相手に答える
  if(b.gauge>=1){
    let best=null,bm=1e9;
    for(const o of others){const c=b.cand[aKey(o)];if(c&&c.length&&c.length<bm){bm=c.length;best=o}}
    if(best&&bm<=Math.floor(b.gauge)*3){
      const c=b.cand[aKey(best)],g=c[(Math.random()*c.length)|0];
      b.gauge-=1;
      if(aNum(best)===g)botKill(best,b);else b.cand[aKey(best)]=c.filter(x=>x!==g);
    }
  }
}

function loop(t){

  // 視点（矢印キー。麻痺中は不可）
  if(p.frz<=0){p.yaw+=((keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0))*1.8*dt;p.pitch=Math.max(-1.5,Math.min(1.5,p.pitch+((keys.ArrowUp?1:0)-(keys.ArrowDown?1:0))*1.5*dt))}

  const sp=WALK*(p.spd>0?1.6:1)*(p.ground?1:AIR)*dt;
  let f=(keys[binds.fwd]?1:0)-(keys[binds.back]?1:0),s=(keys[binds.right]?1:0)-(keys[binds.left]?1:0);
  if(p.frz>0){f=0;s=0}

  p.blind=Math.max(0,p.blind-dt);p.hide=Math.max(0,p.hide-dt);p.cloak=Math.max(0,p.cloak-dt);p.xray=Math.max(0,p.xray-dt);p.radar=Math.max(0,p.radar-dt);

  melody(dt);
  for(let i=traps.length-1;i>=0;i--){
    const tr=traps[i];let trig=false;
    for(const b of bots)if(!trig&&b.st==='alive'&&b.inv<=0&&b.frz<=0&&Math.hypot(wd(b.x-tr.x),wd(b.z-tr.z))<TRR){b.frz=FRZ;trig=true}
    if(!trig&&p.inv<=0&&p.frz<=0&&Math.abs(p.y-tr.y)<1&&Math.hypot(wd(p.x-tr.x),wd(p.z-tr.z))<TRR){p.frz=FRZ;trig=true;flashMsg('トラップを踏んだ！','#f66',1.2)}

  }

    if(d<0.6){nextWp(b);continue}
    if(b.t>4){b.pt=0;b.t=0;continue}
    const fz0=b.frz>0,k=fz0?0:1;if(fz0)b.frz-=dt;
    const vx=dx/d*BSPD*dt*k,vz=dz/d*BSPD*dt*k;
    let moved=false;
    if(!hit(b.x+vx,b.z,0,0.5)){b.x+=vx;moved=true}
    if(!hit(b.x,b.z+vz,0,0.5)){b.z+=vz;moved=true}
    if(!moved)b.pt=0;
    b.x=wd(b.x);b.z=wd(b.z);
    b.g.position.set(b.x,0,b.z);
    // 見えている一番近い相手の方を向く（旋回速度に上限があるので、素早く回り込めば背中を取れる）
    if(!fz0){ // トラップで麻痺中は向きを変えない
      const want=b.fv?Math.atan2(b.fv[0],b.fv[1]):Math.atan2(dx,dz);
      let da=want-b.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));
      b.yaw+=Math.max(-TURN*dt,Math.min(TURN*dt,da));
    }
    b.g.rotation.y=b.yaw;
    b.mat.emissive.setHex(b.frz>0?0x2255ff:0);
  }
  for(const c of chests){
    if(c.on){
      c.g.rotation.y+=dt;
      if(ammo.length<MAXAMMO&&Math.hypot(wd(c.x-p.x),wd(c.z-p.z))<1.3&&Math.abs(p.y-c.y)<1.5){
        c.on=false;c.g.visible=false;c.t=RESPAWN;
        ammo.push(c.item);drawAmmo();sfx('get1');
      }
    }else if((c.t-=dt)<=0){
      spawnChest(c);setChest(c);c.g.visible=true;c.on=true;
    }
  }
  for(const b of bots)if(b.st==='alive')b.plate.visible=b.inv<=0&&p.blind<=0; // 開始・復活直後は誰の数字も見えない
  if(hitTimer>0){hitTimer-=dt;if(hitTimer<=0)hitEl.style.opacity=0}
  // 世界は円環：すべての物をプレイヤーに最も近い位置に描く
  for(const m of bm){m.position.x=p.x+wd(m.userData.bx-p.x);m.position.z=p.z+wd(m.userData.bz-p.z)}
  for(const b of bots)b.g.position.set(p.x+wd(b.x-p.x),0,p.z+wd(b.z-p.z));
  for(const c of chests)c.g.position.set(p.x+wd(c.x-p.x),c.y,p.z+wd(c.z-p.z));
  for(const w of warps)w.g.position.set(p.x+wd(w.x-p.x),w.y,p.z+wd(w.z-p.z));
  drawMini();
  for(const tr of traps){tr.m.position.set(p.x+wd(tr.x-p.x),tr.y+0.03,p.z+wd(tr.z-p.z));tr.m.visible=tr.own==='player'}
  ground.position.set(p.x,0,p.z);grid.position.set(Math.round(p.x/2)*2,0.02,Math.round(p.z/2)*2);
  cam.position.set(p.x,p.y+1.6,p.z);
  cam.rotation.set(p.pitch,p.yaw,0);
  rd.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
